[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-review"
version = "0.1.0"
description = "Triage-driven AI security review: a model triages a diff, then runs targeted data, exposure, and access scans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.80.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ai-security-review = "ai_security_review.cli:main"

[tool.setuptools.packages.find]
include = ["ai_security_review*"]
