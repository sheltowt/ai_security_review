name: Security Review

# Dogfood: review pull requests to this repository with the action itself.
# Only runs when the ANTHROPIC_API_KEY secret is configured.

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: ./
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: '.venv'
