name: 'Triaged AI Security Review'
description: 'A model triages the PR diff, then runs targeted data / exposure / access security scans only where they matter.'
author: 'ai_security_review'

inputs:
  claude-api-key:
    description: 'Anthropic API key. Required for triage and for the api scan backend.'
    required: true
  backend:
    description: 'Scan backend: "api" (Messages API with diff + touched-file context) or "claude-code" (headless Claude Code that can explore the repo).'
    required: false
    default: 'api'
  triage-model:
    description: 'Model used for triage.'
    required: false
    default: 'claude-opus-5'
  scan-model:
    description: 'Model used for the scans.'
    required: false
    default: 'claude-opus-5'
  triage-effort:
    description: 'Effort for triage (low|medium|high|xhigh|max).'
    required: false
    default: 'medium'
  scan-effort:
    description: 'Effort for scans (low|medium|high|xhigh|max).'
    required: false
    default: 'high'
  scans:
    description: 'Skip triage and run exactly these scans (comma-separated: data,exposure,access). Leave empty to let triage decide.'
    required: false
    default: ''
  always-scans:
    description: 'Scans to run regardless of triage (comma-separated).'
    required: false
    default: ''
  triage-threshold:
    description: 'Minimum triage confidence (0-1) for a scan to run.'
    required: false
    default: '0.5'
  min-confidence:
    description: 'Drop findings below this confidence (0-1).'
    required: false
    default: '0.7'
  exclude-directories:
    description: 'Comma-separated directories to exclude from review.'
    required: false
    default: ''
  triage-instructions:
    description: 'Path to a file with extra triage instructions.'
    required: false
    default: ''
  scan-instructions-dir:
    description: 'Directory containing data.md / exposure.md / access.md with project-specific scan instructions.'
    required: false
    default: ''
  comment-pr:
    description: 'Post a summary comment and inline findings on the PR.'
    required: false
    default: 'true'
  fail-on-severity:
    description: 'Fail the step when a finding at or above this severity is kept (HIGH|MEDIUM|LOW|NONE).'
    required: false
    default: 'NONE'
  upload-results:
    description: 'Upload the results JSON and summary as a workflow artifact.'
    required: false
    default: 'true'
  claude-code-timeout:
    description: 'Per-scan timeout in seconds for the claude-code backend.'
    required: false
    default: '1200'

outputs:
  findings-count:
    description: 'Number of findings kept after filtering.'
    value: ${{ steps.review.outputs.findings-count }}
  high-count:
    description: 'Number of HIGH findings.'
    value: ${{ steps.review.outputs.high-count }}
  risk-level:
    description: 'Triage risk level (none|low|medium|high).'
    value: ${{ steps.review.outputs.risk-level }}
  selected-scans:
    description: 'Comma-separated scans that ran.'
    value: ${{ steps.review.outputs.selected-scans }}
  results-file:
    description: 'Path to the results JSON.'
    value: ${{ steps.review.outputs.results-file }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install reviewer
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet "${{ github.action_path }}"

    - name: Install Claude Code (claude-code backend only)
      if: inputs.backend == 'claude-code'
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run triaged security review
      id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.claude-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_PATH: ${{ github.workspace }}
        EXCLUDE_DIRECTORIES: ${{ inputs.exclude-directories }}
        ALWAYS_SCANS: ${{ inputs.always-scans }}
        CUSTOM_TRIAGE_INSTRUCTIONS: ${{ inputs.triage-instructions }}
        CUSTOM_SCAN_INSTRUCTIONS_DIR: ${{ inputs.scan-instructions-dir }}
        COMMENT_PR: ${{ inputs.comment-pr }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        RESULTS_FILE: ${{ github.workspace }}/security-review-results.json
        SUMMARY_FILE: ${{ github.workspace }}/security-review-summary.md
        AI_SECURITY_REVIEW_CLAUDE_CODE_TIMEOUT: ${{ inputs.claude-code-timeout }}
        INPUT_SCANS: ${{ inputs.scans }}
      run: |
        set -o pipefail
        args=(
          --backend "${{ inputs.backend }}"
          --triage-model "${{ inputs.triage-model }}"
          --scan-model "${{ inputs.scan-model }}"
          --triage-effort "${{ inputs.triage-effort }}"
          --scan-effort "${{ inputs.scan-effort }}"
          --triage-threshold "${{ inputs.triage-threshold }}"
          --min-confidence "${{ inputs.min-confidence }}"
        )
        if [ -n "$INPUT_SCANS" ]; then
          args+=(--scans "$INPUT_SCANS")
        fi
        if [ -z "$PR_NUMBER" ]; then
          # Not a pull_request event: review the last commit's changes.
          args+=(--base "${{ github.event.before || 'HEAD~1' }}")
        fi
        ai-security-review "${args[@]}" 2> security-review-error.log || exit_code=$?
        echo "exit_code=${exit_code:-0}" >> "$GITHUB_OUTPUT"
        if [ -s security-review-error.log ]; then
          echo "::group::Reviewer log"; cat security-review-error.log; echo "::endgroup::"
        fi
        if [ "${exit_code:-0}" = "1" ]; then
          echo "::error::Security findings at or above the configured severity were reported."
          exit 1
        elif [ "${exit_code:-0}" != "0" ]; then
          echo "::warning::Reviewer exited with code ${exit_code}; see log above."
        fi

    - name: Upload results
      if: always() && inputs.upload-results == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ai-security-review-results
        path: |
          security-review-results.json
          security-review-summary.md
          security-review-error.log
        retention-days: 7
        if-no-files-found: ignore

branding:
  icon: 'shield'
  color: 'purple'
